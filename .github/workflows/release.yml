# Builds the sidecar from source for each platform on a version tag, attaches the binaries to the
# GitHub release with SHA256SUMS, and records a GitHub build attestation for each binary, so
# `hermes whatsapp-voice install` (and anyone else) can verify where a binary came from:
#   gh attestation verify <binary> --repo 52eraja/hermes-whatsapp-voice-stepfun
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: hermes-wa-voice_linux_amd64
          - runner: ubuntu-24.04-arm
            asset: hermes-wa-voice_linux_arm64
          - runner: macos-latest
            asset: hermes-wa-voice_darwin_arm64
          - runner: macos-15-intel
            asset: hermes-wa-voice_darwin_amd64
          - runner: windows-latest
            asset: hermes-wa-voice_windows_amd64.exe
          - runner: windows-11-arm
            asset: hermes-wa-voice_windows_arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: sidecar
        shell: bash
        run: |
          cargo build --release --locked
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/hermes-wa-voice.exe "../${{ matrix.asset }}"
          else
            cp target/release/hermes-wa-voice "../${{ matrix.asset }}"
          fi
      # Attestation talks to Sigstore's public log, which times out now and then: retry once.
      - id: attest
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: ${{ matrix.asset }}
      - if: steps.attest.outcome == 'failure'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.asset }}
      # `shell: bash` here: the Windows runner's default PowerShell would read "$GITHUB_REF_NAME"
      # as an unset PowerShell variable and upload to an empty tag name.
      - run: gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir dist && cd dist
          gh release download "${{ github.ref_name }}" --pattern 'hermes-wa-voice_*'
          sha256sum hermes-wa-voice_* > SHA256SUMS
          gh release upload "${{ github.ref_name }}" SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
